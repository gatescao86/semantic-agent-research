# Frozen experiment configuration. Everything here must be identical across
# Experiment A (unified) and Experiment B (routed) — the only variable that
# should differ between the two experiments is semantic architecture.
#
# Do not edit this file mid-experiment-run. Changing it after M4 begins
# invalidates the comparison.

model:
  # Router calls and answering-agent calls both use this model. Using the
  # same model for both avoids a confound where routing failures could be
  # blamed on a deliberately weaker router model.
  id: claude-opus-5
  thinking: adaptive
  effort: high
  max_tokens: 8000

agent_loop:
  max_tool_call_iterations: 8

trials:
  n_agent_trials_per_question: 3
  n_judge_calls_per_answer: 3

sql_executor:
  max_rows_returned: 500
  query_timeout_seconds: 60

judge:
  # Same tier as the answering agents (user's explicit choice). Relies on
  # blinding + human calibration (eval/calibration.py) to control for
  # self-preference bias rather than a pricier judge tier.
  model_id: claude-opus-5
  calibration_kappa_threshold: 0.6
  calibration_sample_fraction: 0.2

reproducibility:
  # A late-stage sanity check (plan §8 step 7): re-run this many questions
  # per condition, unchanged, and confirm variance sits within the expected
  # non-determinism band before trusting the main results.
  spot_check_question_count: 10
