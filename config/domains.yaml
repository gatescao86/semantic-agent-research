domains:
  - name: geography
    semantic_model: semantic_models/domains/geography.yaml
    description: >
      Geographic entities (states, counties, CBSAs, zip codes, census
      tracts) and their hierarchy/relationships/overlaps, plus geocoded US
      addresses. Used to resolve place names into geo_id and to join other
      domains by location. Rarely the sole answer to a question by itself.

  - name: economic_indicators
    semantic_model: semantic_models/domains/economic_indicators.yaml
    description: >
      Macroeconomic and regional-business-activity indicators: GDP,
      mortgage rates, retail sales, unemployment claims, CPI/PCE, Federal
      Reserve series (credit, industrial production), BLS employment and
      price series, and Economic Census business-establishment data. Use
      for questions about macroeconomic or regional business conditions.

  - name: demographics
    semantic_model: semantic_models/domains/demographics.yaml
    description: >
      Census ACS-derived population, income, housing, and social
      statistics by geography, plus IRS migration flow data (who is moving
      where). Use for questions about who lives in a market or how its
      population is changing.

  - name: deposits
    semantic_model: semantic_models/domains/deposits.yaml
    description: >
      FDIC-insured bank branch locations and their reported deposit
      amounts (FDIC Summary of Deposits), branch-level. Use for questions
      about bank deposits, branch presence, or deposit market share in a
      geography.

  - name: mortgage_lending
    semantic_model: semantic_models/domains/mortgage_lending.yaml
    description: >
      Loan-level mortgage application/origination data (HMDA) plus FHFA
      house price, mortgage-performance, and appraisal indexes. Use for
      questions about mortgage origination volume, lending patterns,
      interest rates, or house prices.

  - name: financial_institutions
    semantic_model: semantic_models/domains/financial_institutions.yaml
    description: >
      Regulatory identity, corporate/holding-company hierarchy, and
      institution-level financials for FDIC/FFIEC-regulated banks, plus
      CFPB consumer complaints against financial companies. Use for
      questions about a specific bank/institution's identity, ownership
      structure, financial metrics, or consumer complaints — and as the
      bridge when a question needs to connect deposits or mortgage data to
      "which company is this."

  - name: disaster_risk
    semantic_model: semantic_models/domains/disaster_risk.yaml
    description: >
      Federally-declared disasters, FEMA disaster-response funding, and
      National Flood Insurance Program claims/policies by geography. Use
      for questions about a region's disaster history or flood-risk
      exposure.

  - name: markets
    semantic_model: semantic_models/domains/markets.yaml
    description: >
      Daily equity price/volume data for US securities traded on Nasdaq.
      Use only for questions about stock price/trading data for a specific
      ticker — does not join to any other domain in this dataset.
