metrics:
- name: acs_value
  entity: acs_timeseries
  expression: value
  description: 'Raw ACS value for (geo_id, variable, date). Join to acs_attributes
    for what this represents.

    '
- name: migration_value
  entity: migration_timeseries
  expression: value
- name: migration_flow_value
  entity: migration_flow
  expression: value
  description: Value of the flow (population count, income, or households) from from_geo_id
    to to_geo_id.
- name: deposit_value
  entity: deposit_timeseries
  expression: value
  description: 'Raw Summary-of-Deposits value for (branch, variable, date). Join to
    deposit_attributes via variable to identify what this represents (e.g. total deposits
    at that branch).

    '
- name: disaster_assistance_amount
  entity: disaster_declaration
  expression: approved_individual_and_households_program_amount
- name: mission_obligation_amount
  entity: mission_assignment
  expression: obligation_amount
- name: flood_claim_building_damage_amount
  entity: flood_claim
  expression: building_damage_amount
- name: flood_claim_amount_paid
  entity: flood_claim
  expression: amount_paid_on_building_claim
- name: flood_claim_contents_damage_amount
  entity: flood_claim
  expression: contents_damage_amount
- name: flood_claim_count
  entity: flood_claim
  expression: COUNT(*)
- name: flood_policy_total_coverage
  entity: flood_policy
  expression: total_building_insurance_coverage
- name: flood_policy_count
  entity: flood_policy
  expression: policy_count
- name: indicator_value
  entity: indicator_timeseries
  expression: value
  description: 'Raw value for (geo_id, variable, date). Join to indicator_attributes
    via variable to identify which indicator this is (e.g. "30-Year Fixed Rate Mortgage
    Average", "Unemployment Claims").

    '
- name: indicator_value_vintage
  entity: indicator_timeseries_vintage
  expression: value
- name: fed_value
  entity: fed_timeseries
  expression: value
- name: bls_employment_value
  entity: bls_employment_timeseries
  expression: value
- name: bls_price_value
  entity: bls_price_timeseries
  expression: value
  description: CPI/price-index value; join to bls_price_attributes to identify the
    specific product/basket.
- name: economic_census_value
  entity: economic_census_timeseries
  expression: value
- name: institution_metric_value
  entity: institution_timeseries
  expression: value
  description: 'Raw institution-level financial value for (id_rssd, variable, date).
    Join to institution_attributes to identify what this represents.

    '
- name: geography_characteristic_value
  entity: geography_characteristic
  expression: value
- name: stock_value
  entity: stock_price
  expression: value
  description: "Raw value for (ticker, variable, date) \u2014 what it represents (open,\
    \ close, high, low, volume) depends on variable_name.\n"
- name: loan_amount
  entity: mortgage_application
  expression: loan_amount
- name: interest_rate
  entity: mortgage_application
  expression: interest_rate
- name: applicant_income
  entity: mortgage_application
  expression: applicant_income
- name: property_value
  entity: mortgage_application
  expression: property_value
- name: loan_application_count
  entity: mortgage_application
  expression: COUNT(*)
  description: "Number of loan application/origination records matching filters \u2014\
    \ use for volume/count questions."
- name: house_price_index_value
  entity: house_price_timeseries
  expression: value
- name: mortgage_performance_value
  entity: mortgage_performance_timeseries
  expression: value
- name: appraisal_value
  entity: appraisal_timeseries
  expression: value
cross_domain_keys: []
