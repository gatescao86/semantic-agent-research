domain: economic_indicators
description: >
  Macroeconomic and regional-business-activity indicators: general economic
  indicators, Federal Reserve series, BLS employment and price series, and
  Economic Census business-establishment data. This domain has several
  independent attributes/timeseries pairs. A series is a row in an
  attributes catalog — filter variable_name (and release_name where the
  table has it) on each *_ATTRIBUTES entity before concluding it is missing.
  FEDERAL_RESERVE_* is not the only Fed-origin catalog;
  FINANCIAL_ECONOMIC_INDICATORS_* holds many FRED-style series. All
  *_TIMESERIES tables share (geo_id, variable, date, value) joined to a
  matching *_ATTRIBUTES table.

entities:
  - name: indicator_attributes
    table: SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.FINANCIAL_ECONOMIC_INDICATORS_ATTRIBUTES
    primary_key: variable
    description: >
      Catalog of FRED-style general indicator series. Identify a series by
      filtering variable_name / release_name / frequency / seasonally_adjusted
      — do not expect this file to name the series. Distinct from fed_attributes.
  - name: indicator_timeseries
    table: SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.FINANCIAL_ECONOMIC_INDICATORS_TIMESERIES
    primary_key: [geo_id, variable, date]
    description: >
      One row per indicator series, geography, and observation date. Resolve
      `variable` on indicator_attributes first; do not scan this table to
      discover series names.
  - name: indicator_attributes_vintage
    table: SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.FINANCIAL_ECONOMIC_INDICATORS_ATTRIBUTES_VINTAGE
    primary_key: variable
    description: Same as indicator_attributes, for series that track release-vintage history.
  - name: indicator_timeseries_vintage
    table: SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.FINANCIAL_ECONOMIC_INDICATORS_TIMESERIES_VINTAGE
    primary_key: [geo_id, variable, date, release_date]
    description: >
      Point-in-time vintages of indicator values — use when a question needs
      "what was known as of a given release date" rather than the latest
      revised value (use indicator_timeseries for the latter). Resolve
      `variable` on indicator_attributes_vintage first.
  - name: fed_attributes
    table: SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.FEDERAL_RESERVE_ATTRIBUTES
    primary_key: variable
    description: >
      Catalog of series stored on FEDERAL_RESERVE_* in this extract
      (industrial production, sector assets/liabilities, commercial paper).
      Not every Fed release lives here — search indicator_attributes as well.
  - name: fed_timeseries
    table: SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.FEDERAL_RESERVE_TIMESERIES
    primary_key: [geo_id, variable, date]
    description: >
      One row per Federal Reserve series, geography, and observation date.
      Resolve `variable` on fed_attributes first; do not scan this table to
      discover series names.
  - name: bls_employment_attributes
    table: SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.BUREAU_OF_LABOR_STATISTICS_EMPLOYMENT_ATTRIBUTES
    primary_key: variable
    description: Catalog of BLS employment/labor-turnover/wage series (LAUS, JOLTS, SAE).
  - name: bls_employment_timeseries
    table: SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.BUREAU_OF_LABOR_STATISTICS_EMPLOYMENT_TIMESERIES
    primary_key: [geo_id, variable, date]
    description: >
      One row per BLS employment series, geography, and observation date.
      Resolve `variable` on bls_employment_attributes first; do not scan
      this table to discover series names.
  - name: bls_price_attributes
    table: SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.BUREAU_OF_LABOR_STATISTICS_PRICE_ATTRIBUTES
    primary_key: variable
    description: Catalog of BLS CPI / average-price series.
  - name: bls_price_timeseries
    table: SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.BUREAU_OF_LABOR_STATISTICS_PRICE_TIMESERIES
    primary_key: [geo_id, variable, date]
    description: >
      One row per BLS price series, geography, and observation date. Resolve
      `variable` on bls_price_attributes first; do not scan this table to
      discover series names.
  - name: economic_census_attributes
    table: SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.US_ECONOMIC_CENSUS_ATTRIBUTES
    primary_key: variable
    description: >
      Catalog of Economic Census business-activity series (establishment
      counts, employment, payroll, operating costs) by NAICS industry.
  - name: economic_census_timeseries
    table: SNOWFLAKE_PUBLIC_DATA_FREE.PUBLIC_DATA_FREE.US_ECONOMIC_CENSUS_TIMESERIES
    primary_key: [geo_id, variable, date]
    description: >
      One row per Economic Census series, geography, and census year.
      Resolve `variable` on economic_census_attributes first; do not scan
      this table to discover series names.

relationships:
  - from: indicator_timeseries.variable
    to: indicator_attributes.variable
    type: many_to_one
  - from: indicator_timeseries_vintage.variable
    to: indicator_attributes_vintage.variable
    type: many_to_one
  - from: fed_timeseries.variable
    to: fed_attributes.variable
    type: many_to_one
  - from: bls_employment_timeseries.variable
    to: bls_employment_attributes.variable
    type: many_to_one
  - from: bls_price_timeseries.variable
    to: bls_price_attributes.variable
    type: many_to_one
  - from: economic_census_timeseries.variable
    to: economic_census_attributes.variable
    type: many_to_one

