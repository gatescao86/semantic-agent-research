metrics:
  - name: indicator_value
    entity: indicator_timeseries
    expression: value
    description: >
      Raw value for (geo_id, variable, date). Join to indicator_attributes
      via variable to identify which indicator this is (e.g. "30-Year Fixed
      Rate Mortgage Average", "Unemployment Claims").
  - name: indicator_value_vintage
    entity: indicator_timeseries_vintage
    expression: value
  - name: fed_value
    entity: fed_timeseries
    expression: value
  - name: bls_employment_value
    entity: bls_employment_timeseries
    expression: value
  - name: bls_price_value
    entity: bls_price_timeseries
    expression: value
    description: CPI/price-index value; join to bls_price_attributes to identify the specific product/basket.
  - name: economic_census_value
    entity: economic_census_timeseries
    expression: value

cross_domain_keys:
  - entity: indicator_timeseries
    join_key: geo_id
    references: geography.geography.geo_id
  - entity: indicator_timeseries_vintage
    join_key: geo_id
    references: geography.geography.geo_id
  - entity: fed_timeseries
    join_key: geo_id
    references: geography.geography.geo_id
  - entity: bls_employment_timeseries
    join_key: geo_id
    references: geography.geography.geo_id
  - entity: bls_price_timeseries
    join_key: geo_id
    references: geography.geography.geo_id
  - entity: economic_census_timeseries
    join_key: geo_id
    references: geography.geography.geo_id
