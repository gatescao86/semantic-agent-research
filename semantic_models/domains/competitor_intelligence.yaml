# See geography.yaml header note: table/column names must be verified
# against the live database during M0 before being trusted. NAICS 522110
# ("Commercial Banking") below is a starting filter for scoping the company
# universe to bank holding companies — confirm coverage during M0 and adjust
# to the frozen_scope company list in config/domains.yaml.

domain: competitor_intelligence
description: >
  Public company identity and SEC EDGAR filing data (10-K/10-Q/8-K),
  including parsed XBRL financial line items. Scoped in this study to
  public bank holding companies, whose filings report deposits, loans, and
  revenue. Use for questions about specific companies/competitors, their
  reported financials, or competitive positioning.

entities:
  - name: company
    table: SNOWFLAKE_PUBLIC_DATA_FREE.CYBERSYN.COMPANY_INDEX
    primary_key: company_id
    description: >
      One row per company. Filter to bank holding companies via
      naics_code = '522110' (Commercial Banking) or the sic_code equivalent
      — verify which classification column is populated during M0.
  - name: sec_report
    table: SNOWFLAKE_PUBLIC_DATA_FREE.CYBERSYN.SEC_REPORT_INDEX
    primary_key: adsh
    description: One row per SEC filing submission (10-K, 10-Q, 8-K, ...).
  - name: sec_metric
    table: SNOWFLAKE_PUBLIC_DATA_FREE.CYBERSYN.SEC_METRICS_TIMESERIES
    primary_key: [company_id, metric, period_end_date]
    description: >
      Parsed XBRL financial line items per company per reporting period.
      `metric` is a standardized XBRL tag name (e.g. "Deposits",
      "LoansAndLeasesReceivableNetReportedAmount", "Revenues").

relationships:
  - from: sec_report.company_id
    to: company.company_id
    type: many_to_one
  - from: sec_metric.company_id
    to: company.company_id
    type: many_to_one

dimensions:
  - name: company_name
    entity: company
    column: company_name
  - name: naics_code
    entity: company
    column: naics_code
  - name: filing_type
    entity: sec_report
    column: form_type
    # e.g. "10-K", "10-Q", "8-K"
  - name: fiscal_period_end
    entity: sec_metric
    column: period_end_date
    type: date

metrics:
  - name: total_deposits
    entity: sec_metric
    expression: "value WHERE metric = 'Deposits'"
    description: Total deposits as reported in XBRL, most recent filing per period.
  - name: total_loans
    entity: sec_metric
    expression: "value WHERE metric = 'LoansAndLeasesReceivableNetReportedAmount'"
    description: Total loans and leases receivable, net, as reported in XBRL.
  - name: total_revenue
    entity: sec_metric
    expression: "value WHERE metric = 'Revenues'"

cross_domain_keys:
  - entity: company
    join_key: hq_geo_id
    references: geography.geography.geo_id
