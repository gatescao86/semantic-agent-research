[project]
name = "semantic-agent-study"
version = "0.1.0"
description = "Research prototype comparing unified vs. decomposed semantic-layer architectures for enterprise AI data agents."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "snowflake-connector-python>=3.12.0",
    "pyyaml>=6.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "eval*", "logging_*", "analysis*"]
